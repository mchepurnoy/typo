# Publishes a release to GitHub Releases when a version tag (v0.4.0) is pushed: tests, then builds,
# signs, notarizes and uploads Typo-<version>.zip with the signed Sparkle feed appcast.xml.
# Who can release is limited outside this file too: see README.md, Release security.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match CFBundleShortVersionString $VERSION in Support/Info.plist"
            exit 1
          fi
          # Only reviewed code is released: the tagged commit must be on main
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Test
        run: swift test

  release:
    needs: test
    runs-on: macos-26
    timeout-minutes: 60
    # The signing secrets live in this environment, which only v* tags may use and which waits for
    # a reviewer's approval
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import the signing certificate and notarization credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials typo-notary --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN"
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key")
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: scripts/package-release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          # A draft first: releases/latest/download/appcast.xml must never point to a release whose
          # files are still uploading
          gh release create "$TAG" --draft --verify-tag --title "Typo $VERSION" \
            --notes-file build/release/notes.md "build/release/Typo-$VERSION.zip" build/release/appcast.xml
          gh release edit "$TAG" --draft=false --latest

      - name: Remove the keychain and the key
        if: always()
        run: |
          if [ -n "${NOTARY_KEYCHAIN:-}" ]; then security delete-keychain "$NOTARY_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/developer-id.p12"
